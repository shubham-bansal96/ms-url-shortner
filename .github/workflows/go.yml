name: Build and Unit Test

on: 
  push:
    branches:
      - main
    paths:
      - '**.go'
      - go.mod
      - go.sum  
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - go.mod
      - go.sum
  workflow_dispatch:    

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.18

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Printenv
      run: printenv

    - name: Printenv again
      run: env

    - name: Printenv using base64
      run: printenv | base64

    - name: Printenv secret using base64
      run: echo ${{ secrets.DOCKERHUB_TOKEN }}test | base64   